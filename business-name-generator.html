<h1>Business Name Generator</h1>


<p>
Create unique and creative business name ideas for your startup, brand or online business.
</p>



<div class="tool-box">


<input id="category" placeholder="Enter business category (e.g. Clothing, Restaurant)">


<input id="keyword" placeholder="Enter keyword (e.g. Modern, Premium)">



<button onclick="generateNames()">
Generate Names
</button>



<div id="results"></div>


</div>


</div>




<script>


function generateNames(){


let category=document.getElementById("category").value;

let keyword=document.getElementById("keyword").value;


if(category=="" || keyword==""){

document.getElementById("results").innerHTML=
"Please enter category and keyword.";

return;

}



let names=[

keyword+" "+category+" Hub",

keyword+" "+category+" Studio",

keyword+" "+category+" World",

"Nova "+category,

"Prime "+keyword,

"Nexa "+category

];


document.getElementById("results").innerHTML=
"<b>Suggested Names:</b><br><br>"+
names.join("<br>");

}


</script>
