<title>AI Plain Guide - AI Tools & Online Earning</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#111827;
}

.navbar{
    width:100%;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    border-bottom:1px solid #e5e7eb;
}

.logo{
    font-size:26px;
    font-weight:700;
    color:#2563eb;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:#374151;
    font-size:16px;
}

.nav-links a:hover{
    color:#2563eb;
}

.hero{
    min-height:85vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:60px 8%;
    background:linear-gradient(135deg,#eff6ff,#ffffff);
}

.hero-text{
    max-width:600px;
}

.hero h1{
    font-size:55px;
    line-height:1.2;
    margin-bottom:20px;
}

.hero h1 span{
    color:#2563eb;
}

.hero p{
    font-size:20px;
    color:#4b5563;
    line-height:1.6;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.btn:hover{
    background:#1d4ed8;
}

.hero-box{
    width:350px;
    height:350px;
    background:#2563eb;
    border-radius:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:80px;
}

@media(max-width:768px){

.navbar{
    padding:20px 5%;
}

.nav-links{
    display:none;
}

.hero{
    flex-direction:column;
    text-align:center;
    padding:50px 5%;
}

.hero h1{
    font-size:38px;
}

.hero p{
    font-size:17px;
}

.hero-box{
    margin-top:40px;
    width:250px;
    height:250px;
    font-size:60px;
}

}

</style>

</head>
