    margin-top:25px;

    margin-top:50px;

<!-- Tool -->

<div class="container">


<h1>Bizora</h1>


<p>
Discover business ideas, brand names, competition insights and startup opportunities with Bizora AI.
</p>



<div class="tool-box">


<select id="category">

<option value="">Select Business Category</option>
<option value="Restaurant">Restaurant</option>
<option value="Clothing">Clothing Brand</option>
<option value="Technology">Tech Startup</option>
<option value="Beauty">Beauty Brand</option>
<option value="Agency">Digital Agency</option>
<option value="Store">Online Store</option>

</select>


<select id="style">

<option value="">Select Name Style</option>
<option value="Modern">Modern</option>
<option value="Luxury">Luxury</option>
<option value="Creative">Creative</option>
<option value="Simple">Simple</option>

</select>


<input id="keyword" placeholder="Enter keyword (e.g. Nova, Smart, Prime)">


<button onclick="generateNames()">
Generate Names
</button>


<div id="results"></div>


</div>


</div>




<script>


function generateNames(){

let category = document.getElementById("category").value;
let style = document.getElementById("style").value;
let keyword = document.getElementById("keyword").value.trim();


if(category=="" || style=="" || keyword==""){

document.getElementById("results").innerHTML =
"Please select category, style and enter keyword.";

return;

}


let firstWords = [
"Nova",
"Nexa",
"Velo",
"Aura",
"Luma",
"Viva",
"Zeno",
"Orion",
"Elite",
"Prime"
];


let endings = [
"ora",
"via",
"ly",
"ify",
"za",
"lio",
"ora",
"ex",
"ara"
];


let names=[];


for(let i=0; i<6; i++){

let name =
keyword.charAt(0).toUpperCase() +
keyword.slice(1) +
endings[i];

names.push(name);

}


let styleWords = {

"Luxury":["Aurevia","Velora","Grandelle","Luxora"],
"Modern":["Nexora","Novexa","Vistara","Modiva"],
"Creative":["Creativa","Ideora","Artiva","Visiona"],
"Simple":["Purely","Easora","Simplya","Clearva"]

};


if(styleWords[style]){

names = names.concat(styleWords[style]);

}


document.getElementById("results").innerHTML =
"<b>Suggested Brand Names:</b><br><br>" +
names.slice(0,10).join("<br>");

}

</script>
